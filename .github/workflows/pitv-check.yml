name: PiTV Check

on:
  push:
    branches: [pitv-standalone]
    paths:
      - "**"
      - ".github/workflows/pitv-check.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax
        run: |
          python3 -m py_compile             pitv/pitv.py             pitv/apk_backend.py             pitv/store_backend.py             pitv/update_backend.py             system/pitv-helper             system/pitv-self-update
      - name: Shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
          bash -n system/pitv-session
          bash -n system/pitv-waydroid-launch
          bash -n scripts/install-waydroid.sh
      - name: Store JSON
        run: |
          python3 - <<'PY'
          import json
          for path in (
              "store/catalog.json",
              "store/server_catalog.json",
              "config/config.json",
          ):
              with open(path, encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)
          PY
